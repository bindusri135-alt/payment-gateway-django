<!DOCTYPE html>
<html>
<head>
    <title>Refund Successful</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding-top: 80px;
        }

        .box {
            background: white;
            width: 450px;
            margin: auto;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #198754;
        }

        p {
            font-size: 17px;
            margin: 12px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #0d6efd;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Refund Successful!</h1>

    <p><strong>Transaction ID:</strong> {{ transaction.transaction_id }}</p>

    <p><strong>Customer:</strong> {{ transaction.customer_name }}</p>

    <p><strong>Amount:</strong> ₹{{ transaction.amount }}</p>

    <p><strong>Payment Method:</strong> {{ transaction.get_payment_method_display }}</p>

    <p><strong>Status:</strong> {{ transaction.get_status_display }}</p>

    <a href="{% url 'transaction_history' %}">
        Back to Transaction History
    </a>

</div>

</body>
</html>
